{% extends 'construction-base.html' %}
{% load static %}

{% block title %}Settings - Building Management System{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-cog"></i> Settings</h2>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ request.user.email }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.phone|default:'' }}">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="notifications" name="notifications" {% if profile.notifications %}checked{% endif %}>
                <label class="form-check-label" for="notifications">Enable Notifications</label>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
