{% extends 'construction-base.html' %}
{% load static %}

{% block title %}Edit Stock - Building Management System{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2><i class="fas fa-edit"></i> Edit Stock</h2>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="material" class="form-label">Material</label>
                <input type="text" class="form-control" id="material" value="{{ stock.material.name }}" readonly>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <input type="text" class="form-control" id="category" value="{{ stock.material.category }}" readonly>
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="quantity" name="quantity" value="{{ stock.quantity }}" step="0.01" required>
                    <span class="input-group-text">{{ stock.material.unit }}</span>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{% url 'view_stock' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
